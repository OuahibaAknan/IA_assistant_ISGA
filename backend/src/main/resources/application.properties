spring.application.name=chatbot

# MongoDB
spring.mongodb.uri=mongodb://localhost:27017/chatbot_db

# OpenAI
openai.api.url=https://api.openai.com/v1
openai.api.key=${OPEN_AI_KEY}
openai.embedding.model=text-embedding-3-small
openai.model=gpt-5.4-mini
openai.chat.model=gpt-4o-mini

# Optional logs for debugging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.reactive.function.client=INFO

# JWT admin security
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
